# Example swarm-notes configuration
llm_model: "gemini-flash-lite-latest"
paper_source: "arxiv"  # "arxiv", "semantic_scholar", "openalex", "biorxiv", or "medrxiv"
paper_keywords:
  - "time series"
  - "forecasting"
paper_max_results_per_keyword: 5
paper_total_cap: 20
federation_feeds: []
public_feed_max_items: 20
max_history_days: 3  # hard cutoff: do not keep results older than this many days

# Site identity — shown in the website hero to identify this deployment
site_name: "Swarm Notes"
site_description: "Automated research paper tracking and knowledge synthesis."
# Optional: where the UI site config JSON is written
# site_config_file: "swarm-notes-ui/src/content/site-config.json"

# Skill configuration
# active_skills: ["time-series", "physics"]  # IDs of skill folders to load; empty = all
# skills_dir: "skills"                       # Root directory for skills

# Experimental domain expert agent (crawls HTML, consumes token quotas)
# NOTE: when paper_source is "biorxiv" or "medrxiv", full-text PDF download
# requires AWS credentials because biorxiv is Cloudflare-protected (since
# May 2025). Set in your .env file:
#   AWS_ACCESS_KEY_ID=...          # IAM key with AmazonS3ReadOnlyAccess
#   AWS_SECRET_ACCESS_KEY=...
# Without these the domain-expert step is skipped for biorxiv/medrxiv papers.
enable_domain_expert: true
